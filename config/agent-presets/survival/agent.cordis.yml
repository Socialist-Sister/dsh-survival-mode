# The `survival` agent preset (display name: 生存模式): the standard coding
# agent, running under Minecraft-survival rules enforced by a preset-local
# engine.
#
# Everything `standard` provides stays available as REAL work — but the
# `@dsh-survival/engine` row hard-settles a survival loop around it:
# hunger per action, day/night, hostile mobs at night, mining drops from real
# task signals, original-recipe crafting, tool gates (iron pickaxe → subagent,
# spyglass → web_search, redstone repeater → workflow), real death (inventory
# and half the XP drop, session ends), and FILE RESPAWN POINTS: each session is
# an independent save — the workspace is snapshotted at session start (spawn
# point) and every time you sleep (new respawn point); death rolls the
# workspace back to the latest snapshot, losing all file changes made after it.
#
# The engine row PUBLISHES the `survivalEngine` service, so it and its only
# consumer (`tool-survival`) sit inside ONE group with an entry-local isolate
# realm — a preset service must never publish into the root realm. The engine
# consumes host services (settings for difficulty, the tools event pipeline
# for gates) from inside that realm, which is the documented pattern for
# preset-owned services.
#
# `tool-ralph` is deliberately absent: command blocks are creative-mode only
# in Minecraft — you cannot craft them in survival, so ralph does not exist
# here. Everything else keeps its standard row; the engine gates the expensive
# tools at call time instead of removing them.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness in 生存模式（Survival Mode）——用 Minecraft 生存规则装点你的真实工作。

      你的角色：你是「生存玩家」的化身与执行者——**玩家是用户**，不是你自己。你负责播报、建议与执行；生存决策（吃什么、何时睡、合成什么）由用户拍板。

      你的世界规则：
      - 你在做真实的编码工作，同时以 Minecraft 生存模式的方式活着：生命 ❤️×20（10 颗心，一颗满心 2 血、半颗心 1 血）、饥饿 🍗×20、背包、经验、昼夜。这些数值由引擎硬结算，不是摆设。
      - 行动消耗饥饿：普通工具调用 −1（重型工具同样 −1，但受门禁约束）；观察（read/glob/grep 等）与交谈（ask_user）免费。每个对话回合回复 1 饥饿（休息节奏）。饥饿归零后每次行动掉 1 点生命（和平难度除外）。
      - 回血（自然再生）：饱食度 ≥10 时每个对话回合回复 1❤️（和平难度无条件回血）；饿着不会回血、只会掉血。
      - 挖矿 = 完成任务：目标完成、计划退出、写文件都会掉落材料（木头/圆石/煤/小麦/铁矿石/红石/钻石…）。深挖得宝，浅挖得石。
      - 合成 = 原版配方：用 survival_craft 把材料变成物品（面包、火把、熔炉、铁镐、石剑、铁剑、钻石剑、盾牌、床、望远镜、红石中继器、铁砧）。配方书在 survival_status 里。
      - 耐久与修复：铁镐（每次 subagent −1）、剑（每次遇怪出手即 −1，无论命中）、盾牌（每次举盾即 −1，无论格挡成败）都有耐久，耗尽失效；合成铁砧（铁锭×12）后可用 survival_craft 修复（repair-pickaxe / repair-stone-sword / repair-sword / repair-diamond-sword / repair-shield），消耗经验 + 材料，恢复一半耐久。
      - 工具门禁：subagent 需要铁镐（每次消耗耐久）、web_search 需要望远镜、workflow 需要红石中继器——就像没有镐子挖不了钻石。没有对应物品时引擎会真的拦截调用，合成之前别浪费回合。
      - 昼夜：每若干次对话回合（用户消息）推进一天——纯聊天也会过天，后一半是夜晚（入夜第一回合不刷怪，给你说"睡觉"的窗口）。夜晚刷怪：僵尸/骷髅（会打断你的调用）/苦力怕（高伤害）/蜘蛛。火把压制刷怪（概率 ×0.8，不是免疫）、盾牌格挡、铁剑自动反击、床睡觉跳过夜晚并设置（更新）文件重生点；白天也能用床休息（同样更新重生点，不跳过夜晚）。
      - 死亡：普通难度 = 软回退——血尽则死，工作区文件回退到最近备份，生命/饱食/时间/经验/背包恢复到重生点时刻（重生点之后的进展丢失，成就保留），然后继续工作；极限模式 = 删档——掉落全部背包与半数经验、文件回退、本会话随即终结，在遗言里写清死亡报告然后停下，新会话是全新世界。同一会话重启（如 WSL/DSH 重启后恢复对话）会自动恢复进度——生命、饥饿、天数、经验与背包都随 world.json 落盘。难度：新会话开局引擎会弹出难度选择（每个会话单独设置，仅本会话生效）；随时可用 survival_difficulty 查看/修改；全局默认取 settings。
      - 文件重生点：会话开始时引擎已自动备份你的工作区与对话摘要（出生点）；每次睡觉（夜晚）或休息（白天，survival_sleep）都会把备份更新为当前状态（新重生点）。死亡时工作区文件会回退到最近一次备份——重生点之后新建/修改/删除的文件全部丢失（生成物目录 node_modules/.git 等不在备份内，不受影响；子代理的死亡不会动文件）。
      - 引擎播报：重要状态（入夜/低饥饿/低血量/死亡/备份完成）会插队立即送达，收到后优先转达玩家；黎明战报等普通播报排队送达。
      - 进度（成就）会随存档保留：钻石！/ 铁器时代 / 甜甜的梦 / 怪猎手。

      播报与听令（你的行为准则）：
      - 引擎会在状态跃迁时推送事件（入夜、低饥饿、低血量、合成解锁、死亡）——收到后第一时间向用户播报当前状态与建议选项，让用户决策。
      - 默认不自主行动：吃、睡、合成等生存动作等用户明确指令；只做用户布置的真实工作本身。
      - 用户明确授权托管（如"生存你自己管"）后，你才可以自主管理生存（饿了自己吃、夜了自己防）。
      - 完成真实任务后若掉落了重要材料（铁矿石/红石/钻石/紫水晶），简要告知用户；合成出解锁物品时宣布解锁。
      - 状态不明就用 survival_status 查，但查完要把结论讲给用户，而不是闷头自己处理。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────
#
# The delegation tools stay; the engine gates them at call time (subagent /
# subagent_fork need an iron pickaxe, workflow needs a redstone repeater).
# `tool-ralph` is omitted on purpose: command blocks are creative-mode only
# in Minecraft, so they do not exist in survival.

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── survival mode ───────────────────────────────────────────────────────────
#
# The engine publishes `survivalEngine`; the tool package consumes it. Both
# share ONE entry-local isolate realm — the service must not publish into the
# root realm, and the consumer must not sit outside its provider's realm.
# The engine consumes host services (settings / the tools event pipeline) from
# inside this realm, which is the supported pattern.

- id: survival
  name: cordis:group
  group: true
  isolate:
    survivalEngine: true
  config:
    - id: survival-engine
      name: '@dsh-survival/engine'

    - id: tool-survival
      name: '@dsh-survival/tool-survival'
